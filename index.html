<!DOCTYPE html>
<html lang="en" class="h-full w-full bg-gray-100 ">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screenshot Wrapper</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>

<body class="m-0 p-0 bg-gray-100 h-full mx-auto p-4 max-w-2xl flex flex-col gap-4" id="app">
</body>
<script>
  const { createApp, ref, computed, watch, onMounted } = Vue;

  createApp({
    setup() {
      const mockCache = new Map();
      const mocks = ref([]);
      const selectedMock = ref('');
      const spec = ref(null);
      const mockMeta = ref(null);
      const slotImages = ref({});
      const canvas = ref(null);

      const currentSlotDefs = computed(() => {
        if (!spec.value) return [];
        if (spec.value.mode === 'fixed') {
          return spec.value.slots.map(s => ({
            id: s.id, label: s.id,
            hint: `Best fit ${s.width}×${s.height} — image is cropped to fill`,
          }));
        }
        const n = spec.value.nativeSlot;
        return [{
          id: 'main', label: 'Screenshot',
          hint: `Recommended ~${n.width}×${n.height} — any size works, frame resizes to fit`,
        }];
      });

      // Mocks mark screenshot slots by filling a <rect> or <polygon> with pure green (#00ff00).
      // One slot -> the frame grows/shrinks to fit the upload (classic single-device mockup).
      // 2+ slots -> a fixed multi-device layout; each upload is cropped to fill its own slot.
      function isGreenFill(fill) {
        if (!fill) return false;
        const v = fill.trim().toLowerCase();
        if (v === 'lime' || v === '#00ff00' || v === '#0f0') return true;
        const hex = v.match(/^#([0-9a-f]{6})$/);
        if (hex) return hex[1] === '00ff00';
        const shortHex = v.match(/^#([0-9a-f]{3})$/);
        if (shortHex) return shortHex[1] === '0f0';
        const rgb = v.match(/^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/);
        return !!rgb && +rgb[1] === 0 && +rgb[2] === 255 && +rgb[3] === 0;
      }

      function elementBBox(el) {
        if (el.tagName === 'rect') {
          return {
            x: +el.getAttribute('x'), y: +el.getAttribute('y'),
            width: +el.getAttribute('width'), height: +el.getAttribute('height'),
          };
        }
        const pts = el.getAttribute('points').trim().split(/\s+/).map(p => p.split(',').map(Number));
        const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
        const minX = Math.min(...xs), maxX = Math.max(...xs);
        const minY = Math.min(...ys), maxY = Math.max(...ys);
        return { x: minX, y: minY, width: maxX - minX, height: maxY - minY };
      }

      function detectSlots(svgEl) {
        const [vbMinX, vbMinY] = (svgEl.getAttribute('viewBox') || '0 0 0 0').trim().split(/\s+/).map(Number);
        const slots = [...svgEl.querySelectorAll('rect, polygon')]
          .filter(el => isGreenFill(el.getAttribute('fill')))
          .map((el, i) => {
            const b = elementBBox(el);
            return {
              id: el.getAttribute('id') || `slot-${i + 1}`,
              x: Math.round(b.x - vbMinX), y: Math.round(b.y - vbMinY),
              width: Math.round(b.width), height: Math.round(b.height),
            };
          });
        slots.sort((a, b) => a.y - b.y || a.x - b.x); // reading order: top-to-bottom, left-to-right
        return slots;
      }

      function prettify(filename) {
        return filename.replace(/\.svg$/i, '').replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      }

      function buildSpec(svgEl, file, width, height) {
        const slots = detectSlots(svgEl);
        if (!slots.length) {
          console.warn(`Mock "${file}" has no #00ff00 slot marker — skipping.`);
          return null;
        }
        const name = prettify(file);
        if (slots.length === 1) {
          const s = slots[0];
          return {
            mode: 'stretch',
            name,
            insets: { top: s.y, left: s.x, right: width - (s.x + s.width), bottom: height - (s.y + s.height) },
            nativeSlot: { width: s.width, height: s.height },
          };
        }
        return { mode: 'fixed', name, slots: slots.map(s => ({ ...s, fit: 'cover' })) };
      }

      onMounted(async () => {
        const res = await fetch('mocks/list.txt');
        const text = await res.text();
        const files = text.trim().split('\n').filter(Boolean);

        for (const file of files) {
          const rawText = await (await fetch(`mocks/img/${file}`)).text();
          const svgEl = new DOMParser().parseFromString(rawText, 'image/svg+xml').documentElement;
          const width = +svgEl.getAttribute('width');
          const height = +svgEl.getAttribute('height');
          const spec = buildSpec(svgEl, file, width, height);
          if (!spec) continue;
          mockCache.set(file, { file, name: spec.name, width, height, rawText, spec, img: null });
        }

        mocks.value = [...mockCache.values()].map(m => ({ file: m.file, name: m.name }));
        if (mocks.value.length) selectedMock.value = mocks.value[0].file;
      });

      watch(selectedMock, async (file) => {
        if (!file) return;
        const entry = mockCache.get(file);
        if (!entry) return;
        if (!entry.img) {
          const url = URL.createObjectURL(new Blob([entry.rawText], { type: 'image/svg+xml' }));
          entry.img = await loadImg(url);
          URL.revokeObjectURL(url);
        }
        spec.value = entry.spec;
        mockMeta.value = { width: entry.width, height: entry.height, img: entry.img };
        render();
      });

      function onUpload(slotId, e) {
        const file = e.target.files[0];
        if (!file) return;
        const img = new Image();
        img.onload = () => { slotImages.value[slotId] = img; render(); };
        img.src = URL.createObjectURL(file);
      }

      function loadImg(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = src;
        });
      }

      function renderStretch(s, meta) {
        const mockImg = meta.img;
        const mockW = meta.width;
        const mockH = meta.height;
        const ins = s.insets;

        const innerW = mockW - ins.left - ins.right;
        const innerH = mockH - ins.top - ins.bottom;

        const userImage = slotImages.value['main'];
        const ssW = userImage ? userImage.naturalWidth : innerW;
        const ssH = userImage ? userImage.naturalHeight : innerH;

        // Scale borders proportionally using geometric mean of area ratio
        const borderScale = Math.sqrt((ssW * ssH) / (innerW * innerH));
        const bl = Math.round(ins.left * borderScale);
        const bt = Math.round(ins.top * borderScale);
        const br = Math.round(ins.right * borderScale);
        const bb = Math.round(ins.bottom * borderScale);

        // Rasterize mock at scaled size so SVG stays crisp — no pixel upscaling
        const offW = Math.round(mockW * borderScale);
        const offH = Math.round(mockH * borderScale);
        const offscreen = document.createElement('canvas');
        offscreen.width = offW;
        offscreen.height = offH;
        offscreen.getContext('2d').drawImage(mockImg, 0, 0, offW, offH);

        const cvs = canvas.value;
        const ctx = cvs.getContext('2d');
        cvs.width = bl + ssW + br;
        cvs.height = bt + ssH + bb;
        ctx.clearRect(0, 0, cvs.width, cvs.height);

        // Scaled inner dims in the offscreen
        const siw = offW - bl - br;
        const sih = offH - bt - bb;

        // 9-slice from offscreen: corners 1:1, edges stretched in one axis only
        function ds(sx, sy, sw, sh, dx, dy, dw, dh) {
          if (sw > 0 && sh > 0 && dw > 0 && dh > 0)
            ctx.drawImage(offscreen, sx, sy, sw, sh, dx, dy, dw, dh);
        }
        // top row
        ds(0, 0, bl, bt, 0, 0, bl, bt);
        ds(bl, 0, siw, bt, bl, 0, ssW, bt);
        ds(bl + siw, 0, br, bt, bl + ssW, 0, br, bt);
        // middle row
        ds(0, bt, bl, sih, 0, bt, bl, ssH);
        ds(bl + siw, bt, br, sih, bl + ssW, bt, br, ssH);
        // bottom row
        ds(0, bt + sih, bl, bb, 0, bt + ssH, bl, bb);
        ds(bl, bt + sih, siw, bb, bl, bt + ssH, ssW, bb);
        ds(bl + siw, bt + sih, br, bb, bl + ssW, bt + ssH, br, bb);

        if (userImage) {
          ctx.drawImage(userImage, bl, bt);
        }
      }

      function renderFixed(s, meta) {
        const cvs = canvas.value;
        const ctx = cvs.getContext('2d');
        cvs.width = meta.width;
        cvs.height = meta.height;
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        ctx.drawImage(meta.img, 0, 0, meta.width, meta.height);

        for (const slot of s.slots) {
          const img = slotImages.value[slot.id];
          if (!img) continue;
          if (slot.fit !== 'cover') {
            console.warn(`Unsupported fit "${slot.fit}" for slot "${slot.id}"`);
            continue;
          }
          const scale = Math.max(slot.width / img.naturalWidth, slot.height / img.naturalHeight);
          const dw = img.naturalWidth * scale;
          const dh = img.naturalHeight * scale;
          const dx = slot.x + (slot.width - dw) / 2;
          const dy = slot.y + (slot.height - dh) / 2;

          ctx.save();
          ctx.beginPath();
          ctx.rect(slot.x, slot.y, slot.width, slot.height);
          ctx.clip();
          ctx.drawImage(img, dx, dy, dw, dh);
          ctx.restore();
        }
      }

      function render() {
        if (!spec.value || !mockMeta.value || !canvas.value) return;
        if (spec.value.mode === 'fixed') {
          renderFixed(spec.value, mockMeta.value);
        } else {
          renderStretch(spec.value, mockMeta.value);
        }
      }

      function download() {
        if (!canvas.value) return;
        const entry = mockCache.get(selectedMock.value);
        const base = (entry?.name || selectedMock.value)
          .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        const link = document.createElement('a');
        link.download = `${base}.webp`;
        link.href = canvas.value.toDataURL('image/webp');
        link.click();
      }

      return { mocks, selectedMock, canvas, currentSlotDefs, onUpload, download };
    },
    template: `
        <h1 class="text-2xl font-bold mb-6 text-gray-800">Screenshot Wrapper</h1>

        <div class="bg-white rounded-xl shadow p-5 mb-6 flex flex-wrap gap-5 items-end">
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Mock</label>
            <select v-model="selectedMock" class="border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option v-for="m in mocks" :key="m.file" :value="m.file">{{ m.name }}</option>
            </select>
          </div>

          <div v-for="slotDef in currentSlotDefs" :key="slotDef.id">
            <label class="block text-sm font-medium text-gray-600 mb-1">{{ slotDef.label }}</label>
            <input type="file" accept="image/*" @change="onUpload(slotDef.id, $event)"
              class="block text-sm text-gray-700 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer" />
            <p class="text-xs text-gray-400 mt-1">{{ slotDef.hint }}</p>
          </div>

          <button @click="download"
            class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 active:bg-blue-800 font-medium transition-colors">
            Download
          </button>
        </div>

        <div class="bg-white rounded-xl shadow p-6 flex justify-center items-center min-h-48">
          <canvas ref="canvas" class="max-w-full max-h-[65vh] w-auto h-auto object-contain rounded shadow-sm"></canvas>
        </div>

        <footer class="bg-white rounded-xl shadow p-5 mb-6 ">
          <p>
            Made by
            <a class="underline" href="https://koljasam.com/" target="_blank">Kolja Sam</a>.
          </p>

          <p class="text-base-content/90">
            Images stay on your device. I track page views with the privacy-friendly <a href="https://www.goatcounter.com/"
              class="underline" target="_blank">goatcounter</a>, and nothing else.
          </p>

          <p>If this tiny tool was useful to you, you may want to <a href="https://ko-fi.com/S6S81CWUVD" target="_blank"
              rel="noopener" class="underline">
              buy me a coffee
            </a>.
          </p>
          <p>
            Btw, if you want to modify something (e.g. the mocks): This app is extremely simple (single HTML+JS file) and <a
              href="https://github.com/koljapluemer/screenshot-mock-wrapper" class="underline" target="_blank">open source</a>.
          </p>
        </footer>
  `
  }).mount('#app');
</script>
<script>
  window.goatcounter = {
    path: function (p) { return location.host + p }
  }
</script>
<script data-goatcounter="https://koljasam.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

</html>
